<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/payment/assets/img/favicon.ico" type="image/x-icon">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/payment/assets/css/ui.css">
    <style>
        .hero {
            padding: 72px 0 48px;
            text-align: center;
        }

        .hero-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero h1 {
            font-size: clamp(30px, 5vw, 42px);
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin: 20px 0 14px;
            max-width: 720px;
        }

        .hero-desc {
            max-width: 560px;
            margin: 0 0 32px;
            color: var(--muted);
            font-size: 17px;
        }

        .hero .btn-lg {
            min-width: 200px;
        }

        .features {
            padding: 8px 0 56px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .feature {
            display: flex;
            flex-direction: column;
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            margin-bottom: 16px;
        }

        .feature h2 {
            font-size: 17px;
            margin: 0 0 8px;
        }

        .feature p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 640px) {
            .hero {
                padding: 48px 0 36px;
            }

            .hero-desc {
                font-size: 15px;
            }

            .features-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <span class="brand">
                <svg class="brand-mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
                    <rect x="1" y="1" width="24" height="24" rx="7" fill="#F38020"></rect>
                    <path d="M15.5 6.5 8.5 14h3.6l-1.6 5.5 7-7.5h-3.6l1.6-5.5z" fill="#FFFFFF"></path>
                </svg>
                BEpusdt
            </span>
            <span class="badge">加密货币支付网关</span>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container hero-inner">
                <span class="badge badge-dot">服务运行中</span>
                <h1>{{ .title }}</h1>
                <p class="hero-desc">基于 USDT、USDC 等加密货币的自托管支付网关，可自行部署、自主掌控收款与订单数据。</p>
                <a class="btn btn-primary btn-lg" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
                    查看项目仓库
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M7 17 17 7"></path>
                        <path d="M9 7h8v8"></path>
                    </svg>
                </a>
            </div>
        </section>

        <section class="features">
            <div class="container features-grid">
                <div class="card feature">
                    <div class="feature-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3 3 8l9 5 9-5-9-5z"></path>
                            <path d="M3 12.5l9 5 9-5"></path>
                            <path d="M3 17l9 5 9-5"></path>
                        </svg>
                    </div>
                    <h2>多链收款</h2>
                    <p>支持 USDT、USDC 等加密货币收款，覆盖 TRON（TRC20）等常用网络，收款地址统一管理。</p>
                </div>

                <div class="card feature">
                    <div class="feature-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 1 1-2.6-6.4"></path>
                            <path d="M21 3v6h-6"></path>
                        </svg>
                    </div>
                    <h2>自动对账回调</h2>
                    <p>订单状态自动核对，支付完成后通过回调通知商户系统，减少人工对账成本。</p>
                </div>

                <div class="card feature">
                    <div class="feature-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="7" rx="2"></rect>
                            <rect x="3" y="13" width="18" height="7" rx="2"></rect>
                            <path d="M7 7.5h.01"></path>
                            <path d="M7 16.5h.01"></path>
                        </svg>
                    </div>
                    <h2>自托管可控</h2>
                    <p>自行部署、数据自持，不依赖第三方托管服务，可随时自行升级与维护。</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            此页面为公开页面，管理入口请使用专属安全地址访问。
        </div>
    </footer>
</body>

</html>
